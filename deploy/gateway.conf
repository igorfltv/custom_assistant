server {
    listen 8080;
    server_tokens off;
    client_max_body_size 31m;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 200s;
    }
    location = /workspace { return 302 /workspace/; }
    location = /admin { return 302 /admin/; }
    location /workspace/ { proxy_pass http://workspace:8080/; }
    location /admin/ { proxy_pass http://admin:8080/; }
    location / { proxy_pass http://landing:8080; }
}
