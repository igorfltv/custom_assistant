resolver 127.0.0.11 valid=1s ipv6=off;
upstream forma_api { zone forma_api 64k; server backend:8000 resolve; }
upstream forma_landing { zone forma_landing 64k; server landing:8080 resolve; }
upstream forma_workspace { zone forma_workspace 64k; server workspace:8080 resolve; }
upstream forma_admin { zone forma_admin 64k; server admin:8080 resolve; }

server {
    listen 8080;
    server_tokens off;
    client_max_body_size 31m;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    location /api/ {
        proxy_pass http://forma_api;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 200s;
    }
    location = /workspace { return 302 /workspace/; }
    location = /admin { return 302 /admin/; }
    location /workspace/ { proxy_pass http://forma_workspace/; }
    location /admin/ { proxy_pass http://forma_admin/; }
    location / { proxy_pass http://forma_landing; }
}
